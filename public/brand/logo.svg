<svg width="640" height="200" viewBox="0 0 640 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Intellectual Creativity — for Information Technology">
  <!-- Clean vector logo: wordmark on the left, stylized human-head-with-circuit on the right.
       Colors: navy (#3A5680) for the head silhouette (dark blue),
               medium-bright navy (#5478B5) for the body text (readable on dark bg),
               bright cyan (#22D3EE) for CREATIVITY + circuit traces + nodes. -->

  <!-- ===================== WORDMARK (LEFT) ===================== -->
  <g font-family="'Space Grotesk', 'Inter', 'Geist', system-ui, sans-serif" text-rendering="geometricPrecision">
    <!-- Top line: INTELLECTUAL (navy) + space + CREATIVITY (cyan) -->
    <text x="20" y="92" font-size="38" font-weight="700" letter-spacing="1.6" fill="#5478B5">INTELLECTUAL</text>
    <text x="296" y="92" font-size="38" font-weight="700" letter-spacing="1.6" fill="#22D3EE">CREATIVITY</text>
    <!-- Subtitle: FOR INFORMATION TECHNOLOGY -->
    <text x="22" y="128" font-size="13" font-weight="500" letter-spacing="5.4" fill="#5478B5">FOR INFORMATION TECHNOLOGY</text>
  </g>

  <!-- ===================== HEAD GRAPHIC (RIGHT) ===================== -->
  <g transform="translate(450, 18)">
    <!-- Head silhouette (facing right) — dark navy fill, the "dark blue" presence.
         Path traces a rounded cranium tapering to a chin, with a smooth back-of-head curve. -->
    <path
      d="M70 16
         C 40 18, 22 42, 22 74
         C 22 104, 36 122, 52 134
         L 56 162
         L 78 162
         L 80 136
         L 100 134
         C 112 132, 118 122, 118 108
         L 118 96
         L 132 92
         L 132 78
         L 118 74
         L 118 56
         L 104 52
         L 96 38
         L 96 22
         C 96 18, 90 16, 84 16
         Z"
      fill="#3A5680"
      stroke="#5478B5"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Central vertical spine (the main neural pathway down the head) -->
    <path d="M84 30 L 84 150" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" />

    <!-- 4 horizontal circuit traces extending LEFT from the spine, each
         ending in a filled node. Top → bottom. -->
    <g stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M84 50 L 44 50" />
      <path d="M84 78 L 52 78" />
      <path d="M84 106 L 48 106" />
      <path d="M84 132 L 56 132" />
    </g>

    <!-- Nodes (filled cyan dots) at the end of each trace -->
    <g fill="#22D3EE">
      <circle cx="44" cy="50" r="3.6" />
      <circle cx="52" cy="78" r="3.6" />
      <circle cx="48" cy="106" r="3.6" />
      <circle cx="56" cy="132" r="3.6" />
    </g>

    <!-- Subtle cyan glow accent inside the cranium (small dot near the top) -->
    <circle cx="84" cy="36" r="2.4" fill="#22D3EE" />
  </g>
</svg>
